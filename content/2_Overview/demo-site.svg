<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d">
<title id="t">One site in detail: FortiGate FGCP pair, Transit Gateway, spokes and management VPC</title>
<desc id="d">Site A inspection VPC with a primary FortiGate in AZ1 and a secondary in AZ2, each with port1 to port4. GRE tunnels from the primary port2 go to the Transit Gateway, which serves the east and west spoke VPCs. Port4 of each unit reaches FortiManager and FortiAnalyzer in the management VPC. Port1 and port3 reach the internet gateway; IPsec runs from the cluster EIP to site B.</desc>
