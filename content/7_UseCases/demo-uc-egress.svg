<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 570" width="1240" height="570" role="img" aria-labelledby="t d">
<title id="t">Internet egress from the spokes through the primary FortiGate</title>
<desc id="d">The FortiGate advertises a default route to the TGW over BGP. Spoke traffic goes from the instance to the TGW spoke route table, over the Connect GRE tunnel to gre-east or gre-west, through policy 1 or 2 with source NAT, out port1 and the IGW to the internet with the cluster EIP as source.</desc>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5b6b7b"/></marker></defs>
<rect width="1240" height="570" fill="#ffffff"/>
<text x="620.0" y="26" font-size="15" font-weight="700" fill="#1d2733" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Spoke internet egress through the primary FortiGate (site A shown)</text>
<rect x="250" y="56" width="170" height="420" rx="10" fill="#e9f1fb" stroke="#3c6ea8" stroke-width="2"/>
<text x="335" y="78" font-size="13" font-weight="700" fill="#2a4f7a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Transit Gateway</text>
<rect x="470" y="56" width="420" height="420" rx="10" fill="#fdeceb" stroke="#c0392b" stroke-width="2"/>
<text x="680" y="78" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">FortiGate primary</text>
<rect x="790" y="215" width="90" height="70" rx="6" fill="#ffffff" stroke="#3c6ea8" stroke-width="2"/>
<text x="835" y="237" font-size="12" font-weight="700" fill="#3c6ea8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">port1</text>
<text x="835" y="253" font-size="10" font-weight="400" fill="#1d2733" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">10.1.0.4</text>
<text x="835" y="268" font-size="10" font-weight="400" fill="#5a6877" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">VRF 0</text>
<rect x="30" y="95" width="170" height="110" rx="8" fill="#ffffff" stroke="#1f6fb5" stroke-width="2"/>
<text x="42" y="118" font-size="12" font-weight="700" fill="#1f6fb5" text-anchor="start" font-family="Helvetica, Arial, sans-serif">East spoke instance</text>
<text x="42" y="136" font-size="11" font-weight="700" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">10.1.10.132</text>
<text x="42" y="154" font-size="10" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">10.1.10.0/24</text>
<text x="42" y="172" font-size="10" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">no IGW</text>
<text x="42" y="188" font-size="10" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">curl https://ifconfig.me</text>
<polyline points="200,150 265,150" fill="none" stroke="#1f6fb5" stroke-width="4" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="232" y="140" font-size="9.5" font-weight="400" fill="#5a6877" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">VPC attach.</text>
<rect x="265" y="110" width="140" height="80" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="2"/>
<text x="275" y="130" font-size="11.5" font-weight="700" fill="#1f6fb5" text-anchor="start" font-family="Helvetica, Arial, sans-serif">spoke_rt [east]</text>
<text x="275" y="147" font-size="10" font-weight="700" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">default route 0.0.0.0/0</text>
<text x="275" y="162" font-size="10" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">learned by BGP from</text>
<text x="275" y="176" font-size="10" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">the east Connect peer</text>
<polyline points="405,162 490,162" fill="none" stroke="#1f6fb5" stroke-width="4" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="447" y="178" font-size="9.5" font-weight="700" fill="#1f6fb5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Connect (GRE)</text>
<polyline points="490,138 405,138" fill="none" stroke="#5b6b7b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="447" y="132" font-size="9.5" font-weight="700" fill="#5b6b7b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">BGP default</text>
<rect x="490" y="130" width="90" height="64" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="2"/>
<text x="535" y="152" font-size="11.5" font-weight="700" fill="#1f6fb5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">gre-east</text>
<text x="535" y="168" font-size="9" font-weight="400" fill="#5a6877" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">port2 underlay</text>
<polyline points="580,162 620,162" fill="none" stroke="#1f6fb5" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="620" y="125" width="140" height="74" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="2"/>
<text x="630" y="144" font-size="11.5" font-weight="700" fill="#1f6fb5" text-anchor="start" font-family="Helvetica, Arial, sans-serif">policy 1  (east)</text>
<text x="630" y="160" font-size="10" font-weight="400" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">gre-east to port1</text>
<text x="630" y="175" font-size="10" font-weight="700" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">SNAT to the port1 address</text>
<text x="630" y="189" font-size="10" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">logged</text>
<polyline points="760,162 835,162 835,215" fill="none" stroke="#1f6fb5" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="30" y="315" width="170" height="110" rx="8" fill="#ffffff" stroke="#d9822b" stroke-width="2"/>
<text x="42" y="338" font-size="12" font-weight="700" fill="#d9822b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">West spoke instance</text>
<text x="42" y="356" font-size="11" font-weight="700" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">10.1.20.132</text>
<text x="42" y="374" font-size="10" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">10.1.20.0/24</text>
<text x="42" y="392" font-size="10" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">no IGW</text>
<text x="42" y="408" font-size="10" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">curl https://ifconfig.me</text>
<polyline points="200,370 265,370" fill="none" stroke="#d9822b" stroke-width="4" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="232" y="360" font-size="9.5" font-weight="400" fill="#5a6877" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">VPC attach.</text>
<rect x="265" y="330" width="140" height="80" rx="6" fill="#ffffff" stroke="#d9822b" stroke-width="2"/>
<text x="275" y="350" font-size="11.5" font-weight="700" fill="#d9822b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">spoke_rt [west]</text>
<text x="275" y="367" font-size="10" font-weight="700" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">default route 0.0.0.0/0</text>
<text x="275" y="382" font-size="10" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">learned by BGP from</text>
<text x="275" y="396" font-size="10" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">the west Connect peer</text>
<polyline points="405,382 490,382" fill="none" stroke="#d9822b" stroke-width="4" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="447" y="398" font-size="9.5" font-weight="700" fill="#d9822b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Connect (GRE)</text>
<polyline points="490,358 405,358" fill="none" stroke="#5b6b7b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="447" y="352" font-size="9.5" font-weight="700" fill="#5b6b7b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">BGP default</text>
<rect x="490" y="350" width="90" height="64" rx="6" fill="#ffffff" stroke="#d9822b" stroke-width="2"/>
<text x="535" y="372" font-size="11.5" font-weight="700" fill="#d9822b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">gre-west</text>
<text x="535" y="388" font-size="9" font-weight="400" fill="#5a6877" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">port2 underlay</text>
<polyline points="580,382 620,382" fill="none" stroke="#d9822b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="620" y="345" width="140" height="74" rx="6" fill="#ffffff" stroke="#d9822b" stroke-width="2"/>
<text x="630" y="364" font-size="11.5" font-weight="700" fill="#d9822b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">policy 2  (west)</text>
<text x="630" y="380" font-size="10" font-weight="400" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">gre-west to port1</text>
<text x="630" y="395" font-size="10" font-weight="700" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">SNAT to the port1 address</text>
<text x="630" y="409" font-size="10" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">logged</text>
<polyline points="760,382 835,382 835,285" fill="none" stroke="#d9822b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/>
<polyline points="880,250 935,250" fill="none" stroke="#3c6ea8" stroke-width="4" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="935" y="225" width="80" height="50" rx="6" fill="#e7ecf1" stroke="#5b6b7b" stroke-width="2"/>
<text x="975" y="247" font-size="12" font-weight="700" fill="#5b6b7b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">IGW</text>
<text x="975" y="262" font-size="9.5" font-weight="400" fill="#5a6877" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">cluster EIP</text>
<polyline points="1015,250 1060,250" fill="none" stroke="#3c6ea8" stroke-width="4" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="1060" y="215" width="140" height="70" rx="22" fill="#eef2f6" stroke="#9aa9b8" stroke-width="1.5"/>
<text x="1130" y="245" font-size="13" font-weight="700" fill="#1d2733" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Internet</text>
<text x="1130" y="262" font-size="10" font-weight="400" fill="#5a6877" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">source = cluster EIP</text>
<rect x="30" y="500" width="1180" height="56" rx="8" fill="#f4f7fa" stroke="#d3dbe3" stroke-width="1"/>
<text x="46" y="520" font-size="10.5" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Both customers share port1 and the cluster EIP, so both print the same public address. Every flow stays in the default routing table.</text>
<text x="46" y="538" font-size="10.5" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Needs: a default route in each TGW spoke_rt, the BGP session up, and 0.0.0.0/0 in pl-&lt;customer&gt;-out (otherwise the neighbor shows &quot;default not sent&quot;).</text>
</svg>
