<text x="46" y="516" font-size="10.5" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Proof: ping from the site A east instance shows 10.2.10.0/24 via gre-east-x, ICMP on gre-east-x only, and the gre-west-x counters do not move.</text>
<text x="46" y="534" font-size="10.5" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">The IPsec tunnel is the only path between the sites. If the ping fails, check in order: IPsec up, execute ping 169.254.10.2, the route, then policies 3 and 4.</text>
