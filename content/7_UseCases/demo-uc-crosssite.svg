<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" role="img" aria-labelledby="t d">
<title id="t">Cross-site traffic: east to east and west to west through GRE inside IPsec</title>
<desc id="d">An east instance at site A reaches the east instance at site B through the TGW, gre-east, policy 3, gre-east-x inside the IPsec tunnel, policy 4 on site B, gre-east and the site B TGW. West uses gre-west, policies 5 and 6, and gre-west-x.</desc>
