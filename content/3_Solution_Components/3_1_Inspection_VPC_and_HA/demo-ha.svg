<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
<title id="t">Inspection VPC subnets and FortiGate interfaces in each availability zone</title>
<desc id="d">Each AZ has public, private, ha-mgmt and TGW subnets. FortiGate port1, port2 and port3 attach to the public, private and ha-mgmt subnets. Port3 of the two units is joined by the HA link. Port4 of each unit goes to the management VPC.</desc>
<rect width="1200" height="700" fill="#ffffff"/>
<text x="600.0" y="28" font-size="15" font-weight="700" fill="#1d2733" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Inspection VPC 10.1.0.0/21 (site A): eight /24 subnets, four per AZ</text>
