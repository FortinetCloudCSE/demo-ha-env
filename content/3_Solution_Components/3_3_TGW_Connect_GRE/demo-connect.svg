<text x="552" y="188" font-size="10" font-weight="400" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">GRE outer 10.254.1.10</text>
<text x="552" y="204" font-size="10" font-weight="400" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">inside 169.254.6.0/29</text>
<text x="552" y="220" font-size="10" font-weight="400" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">TGW BGP peers .2 and .3</text>
<text x="552" y="236" font-size="10" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">BGP is required, not static</text>
<polyline points="200,150 285,150" fill="none" stroke="#1f6fb5" stroke-width="2.5" stroke-linejoin="round"/>
<text x="242" y="142" font-size="9.5" font-weight="400" fill="#5a6877" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">VPC attach.</text>
