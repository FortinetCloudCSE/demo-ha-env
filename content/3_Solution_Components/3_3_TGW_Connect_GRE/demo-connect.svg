<text x="552" y="433" font-size="10.5" font-weight="700" fill="#d9822b" text-anchor="start" font-family="Helvetica, Arial, sans-serif">[west]  one peer</text>
<text x="552" y="453" font-size="10" font-weight="400" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">GRE outer 10.254.1.11</text>
<text x="552" y="469" font-size="10" font-weight="400" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">inside 169.254.7.0/29</text>
