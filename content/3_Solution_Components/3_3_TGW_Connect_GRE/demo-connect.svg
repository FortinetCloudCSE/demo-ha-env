<text x="820" y="187" font-size="10" font-weight="400" fill="#5a6877" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">10.254.1.10 to 10.1.2.4</text>
<rect x="930" y="120" width="220" height="150" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="2"/>
<text x="942" y="142" font-size="12.5" font-weight="700" fill="#1f6fb5" text-anchor="start" font-family="Helvetica, Arial, sans-serif">gre-east</text>
<text x="942" y="160" font-size="10" font-weight="400" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">ip 169.254.6.1, remote 169.254.6.2</text>
<text x="942" y="176" font-size="10" font-weight="400" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">mtu 1400</text>
<text x="942" y="194" font-size="10" font-weight="400" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">eBGP AS 65001, two neighbors</text>
<text x="942" y="210" font-size="10" font-weight="400" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">(169.254.6.2 and 169.254.6.3)</text>
<text x="942" y="228" font-size="10" font-weight="700" fill="#1f6fb5" text-anchor="start" font-family="Helvetica, Arial, sans-serif">default-originate</text>
<text x="942" y="244" font-size="10" font-weight="400" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">prefix-list-out: remote CIDR</text>
<text x="942" y="258" font-size="10" font-weight="400" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">and 0.0.0.0/0</text>
<rect x="30" y="365" width="170" height="170" rx="8" fill="#ffffff" stroke="#d9822b" stroke-width="2"/>
