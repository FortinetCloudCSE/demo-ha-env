<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
<title id="t">TGW Connect: per-customer route tables, Connect attachments and GRE tunnels to the primary FortiGate</title>
<desc id="d">Each spoke VPC has a spoke route table and a connect route table on the Transit Gateway and its own Connect attachment. A GRE tunnel with eBGP runs from each Connect attachment to the primary FortiGate port2, as gre-east and gre-west.</desc>
<rect width="1200" height="700" fill="#ffffff"/>
<text x="600.0" y="26" font-size="15" font-weight="700" fill="#1d2733" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">One Connect attachment, two route tables and one GRE tunnel per customer (site A shown)</text>
<rect x="250" y="50" width="480" height="560" rx="10" fill="#f3f7fc" stroke="#3c6ea8" stroke-width="2"/>
<text x="266" y="72" font-size="13" font-weight="700" fill="#2a4f7a" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Transit Gateway  10.254.1.0/24  ·  AS 64512</text>
<rect x="910" y="50" width="260" height="560" rx="10" fill="#fdeceb" stroke="#c0392b" stroke-width="2"/>
<text x="1040" y="74" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">FortiGate primary</text>
<text x="1040" y="92" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">port2  10.1.2.4  (GRE underlay)</text>
<text x="1040" y="108" font-size="10" font-weight="400" fill="#5a6877" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">static route to the TGW block via port2</text>
<rect x="30" y="100" width="170" height="170" rx="8" fill="#ffffff" stroke="#1f6fb5" stroke-width="2"/>
<text x="45" y="124" font-size="13" font-weight="700" fill="#1f6fb5" text-anchor="start" font-family="Helvetica, Arial, sans-serif">East VPC</text>
<text x="45" y="142" font-size="11" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">10.1.10.0/24</text>
<text x="45" y="164" font-size="10.5" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">test instance</text>
<text x="45" y="179" font-size="10.5" font-weight="400" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">10.1.10.132</text>
<text x="45" y="210" font-size="10" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">no IGW; default route</text>
<text x="45" y="224" font-size="10" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">comes from the TGW</text>
<rect x="285" y="100" width="190" height="100" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.8"/>
<text x="297" y="120" font-size="12" font-weight="700" fill="#1f6fb5" text-anchor="start" font-family="Helvetica, Arial, sans-serif">spoke_rt [east]</text>
<text x="297" y="138" font-size="10" font-weight="400" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">associated: spoke attachment</text>
<text x="297" y="154" font-size="10" font-weight="400" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">learns by BGP: default route</text>
<text x="297" y="168" font-size="10" font-weight="400" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">and the remote-site CIDRs</text>
<rect x="285" y="220" width="190" height="90" rx="6" fill="#ffffff" stroke="#1f6fb5" stroke-width="1.8"/>
<text x="297" y="240" font-size="12" font-weight="700" fill="#1f6fb5" text-anchor="start" font-family="Helvetica, Arial, sans-serif">connect_rt [east]</text>
<text x="297" y="258" font-size="10" font-weight="400" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">associated: Connect attachment</text>
<text x="297" y="274" font-size="10" font-weight="400" fill="#1d2733" text-anchor="start" font-family="Helvetica, Arial, sans-serif">learns only 10.1.10.0/24</text>
<text x="297" y="288" font-size="10" font-weight="400" fill="#5a6877" text-anchor="start" font-family="Helvetica, Arial, sans-serif">(from the spoke attachment)</text>
<rect x="540" y="130" width="170" height="130" rx="6" fill="#e9f1fb" stroke="#1f6fb5" stroke-width="2.2"/>
<text x="552" y="152" font-size="12" font-weight="700" fill="#1f6fb5" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Connect attachment</text>
